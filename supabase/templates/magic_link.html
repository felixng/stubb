<!-- Sign-in email (#13). Used locally via config.toml; paste the same subject
     and body into the hosted project: Authentication → Emails → Magic Link. -->
<h2>Your Stubbed sign-in code</h2>
<p style="font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p>Enter this code on the sign-in page. It expires in an hour.</p>
<p>Or <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email">sign in on this device</a>.</p>
<p>If you didn’t ask for this, you can ignore this email.</p>
